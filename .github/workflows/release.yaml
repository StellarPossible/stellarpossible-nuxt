name: Deploy StellarPossible Platform

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PM2_APP_NAME: 'stellarpossible-nuxt'
  WP_DIR_NAME: 'cms'
  ARTIFACT_NAME: 'nuxt-build'
  ARTIFACT_RETENTION_DAYS: 1

jobs:
  prepare:
    name: 🔧 Prepare Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server_path: ${{ steps.config.outputs.server_path }}
      domain_name: ${{ steps.config.outputs.domain_name }}
      app_version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.config.outputs.environment }}

    steps:
      - name: Set deployment configuration
        id: config
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'production' }}"
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          
          if [[ "${ENVIRONMENT}" == "staging" ]]; then
            echo "server_path=/var/www/staging.stellarpossible.com" >> $GITHUB_OUTPUT
            echo "domain_name=staging.stellarpossible.com" >> $GITHUB_OUTPUT
          else
            echo "server_path=/var/www/stellarpossible.com" >> $GITHUB_OUTPUT
            echo "domain_name=stellarpossible.com" >> $GITHUB_OUTPUT
          fi
      
      - name: Determine application version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify package files and dependencies
        run: |
          if [[ ! -f "package.json" ]]; then
            echo "❌ package.json not found"
            exit 1
          fi
          if [[ ! -f "package-lock.json" ]]; then
            echo "❌ package-lock.json not found"
            exit 1
          fi
          
          # Check for required SCSS files
          if [[ ! -f "assets/scss/main.scss" ]]; then
            echo "❌ assets/scss/main.scss not found"
            exit 1
          fi
          if [[ ! -f "assets/scss/variables.scss" ]]; then
            echo "❌ assets/scss/variables.scss not found"
            exit 1
          fi
          
          echo "✅ Package files and dependencies verified"

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed successfully"
          
          # Verify sass is installed
          if ! npm list sass --depth=0; then
            echo "⚠️ Sass not found in dependencies, installing..."
            npm install sass --save-dev
          fi

      - name: Debug build environment
        run: |
          echo "🔍 Build environment debug:"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Package.json scripts:"
          cat package.json | jq '.scripts'
          echo "Nuxt config exists: $(test -f nuxt.config.ts && echo 'Yes' || echo 'No')"

      - name: Build Nuxt application
        run: |
          echo "🏗️ Building Nuxt application for ${{ needs.prepare.outputs.environment }}"
          
          # Set build environment variables
          export NODE_ENV=production
          export WP_USER="${{ secrets.WP_USER }}"
          export WP_APP_PASSWORD="${{ secrets.WP_APP_PASSWORD }}"
          export WP_GRAPHQL_ENDPOINT="https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/graphql"
          export WP_REST_ENDPOINT="https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/wp-json"
          export WP_API_URL="https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}"
          export USE_JWT="${{ secrets.USE_JWT }}"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          
          # Run build with verbose output
          npm run build -- --verbose
          
          echo "✅ Build completed"

      - name: Verify build output
        run: |
          echo "🔍 Verifying build output..."
          
          if [[ ! -d ".output" ]]; then
            echo "❌ Build failed - .output directory not found"
            echo "Current directory contents:"
            ls -la
            exit 1
          fi
          
          if [[ ! -f ".output/server/index.mjs" ]]; then
            echo "❌ Build failed - server entry point not found"
            echo ".output directory contents:"
            ls -la .output/
            if [[ -d ".output/server" ]]; then
              echo ".output/server contents:"
              ls -la .output/server/
            fi
            exit 1
          fi
          
          if [[ ! -d ".output/public" ]]; then
            echo "❌ Build failed - public assets not found"
            echo ".output directory contents:"
            ls -la .output/
            exit 1
          fi
          
          echo "✅ Build output verified"
          echo "📊 Build statistics:"
          du -sh .output
          echo "📁 .output structure:"
          find .output -type d | head -20
          echo "📄 Key files:"
          find .output -name "*.mjs" -o -name "*.js" | head -10
          echo "🎨 Static assets:"
          find .output/public -type f | wc -l | xargs echo "Total files:"

      - name: Create deployment metadata
        run: |
          mkdir -p .output/meta
          cat > .output/meta/deployment.json << EOF
          {
            "version": "${{ needs.prepare.outputs.app_version }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "environment": "${{ needs.prepare.outputs.environment }}",
            "buildTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "buildBy": "GitHub Actions",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}"
          }
          EOF
          
          # Create human-readable version file
          cat > .output/public/VERSION.txt << EOF
          Version: ${{ needs.prepare.outputs.app_version }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Environment: ${{ needs.prepare.outputs.environment }}
          Built: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Built by: GitHub Actions
          Repository: ${{ github.repository }}
          EOF
          
          echo "✅ Deployment metadata created"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .output
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 6

  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, build]
    environment: ${{ needs.prepare.outputs.environment }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .output

      - name: Verify artifact integrity
        run: |
          if [[ ! -d ".output" ]] || [[ ! "$(ls -A .output)" ]]; then
            echo "❌ Artifact download failed or directory is empty"
            exit 1
          fi
          
          if [[ ! -f ".output/server/index.mjs" ]]; then
            echo "❌ Server entry point missing from artifact"
            exit 1
          fi
          
          if [[ ! -f ".output/meta/deployment.json" ]]; then
            echo "❌ Deployment metadata missing from artifact"
            exit 1
          fi
          
          echo "✅ Artifact integrity verified"
          echo "📦 Artifact contents:"
          ls -la .output
          
          echo "📋 Deployment metadata:"
          cat .output/meta/deployment.json

      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_SERVER }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o ConnectTimeout=10 ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "echo 'SSH connection successful' && whoami && pwd"

      - name: Create backup of existing deployment
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            SERVER_PATH='${{ needs.prepare.outputs.server_path }}'
            BACKUP_DIR='\${SERVER_PATH}/backups'
            TIMESTAMP=\$(date +%Y%m%d-%H%M%S)
            
            # Create backups directory
            mkdir -p \"\${BACKUP_DIR}\"
            
            # Backup current Nuxt deployment if it exists
            if [[ -f \"\${SERVER_PATH}/.output/server/index.mjs\" ]]; then
              echo '📦 Creating backup of current deployment...'
              tar -czf \"\${BACKUP_DIR}/nuxt-backup-\${TIMESTAMP}.tar.gz\" \
                -C \"\${SERVER_PATH}\" \
                --exclude='${{ env.WP_DIR_NAME }}' \
                --exclude='backups' \
                --exclude='node_modules' \
                .output ecosystem.config.js .env 2>/dev/null || true
              echo '✅ Nuxt deployment backup created'
            fi
            
            # Backup WordPress if it exists
            if [[ -f \"\${SERVER_PATH}/${{ env.WP_DIR_NAME }}/wp-config.php\" ]]; then
              echo '📦 Creating backup of WordPress...'
              tar -czf \"\${BACKUP_DIR}/wp-backup-\${TIMESTAMP}.tar.gz\" \
                -C \"\${SERVER_PATH}/${{ env.WP_DIR_NAME }}\" \
                . 2>/dev/null || echo 'WordPress backup completed with warnings'
              echo '✅ WordPress backup created'
            fi
            
            # Keep only the latest 5 backups
            find \"\${BACKUP_DIR}\" -name '*.tar.gz' -type f -printf '%T@ %p\n' | \
              sort -rn | tail -n +6 | cut -d' ' -f2- | xargs -r rm -f
            
            echo '🧹 Old backups cleaned up'
          "

      - name: Deploy application files
        run: |
          echo "🚀 Deploying to ${{ needs.prepare.outputs.server_path }}"
          
          # Upload the built application
          rsync -avz --delete \
            --exclude="/${{ env.WP_DIR_NAME }}/" \
            --exclude="/backups/" \
            --exclude="/node_modules/" \
            .output/ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:${{ needs.prepare.outputs.server_path }}/.output/
          
          echo "✅ Application files deployed"

      - name: Configure environment and dependencies
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            cd '${{ needs.prepare.outputs.server_path }}'
            
            # Create environment file
            cat > .env << 'EOF'
          WP_USER=${{ secrets.WP_USER }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          WP_GRAPHQL_ENDPOINT=https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/graphql
          WP_REST_ENDPOINT=https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/wp-json
          WP_API_URL=https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}
          USE_JWT=${{ secrets.USE_JWT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          NITRO_PORT=3000
          HOST=0.0.0.0
          EOF
            
            echo '✅ Environment file created'
            
            # Install production dependencies if package.json exists
            if [[ -f 'package.json' ]]; then
              echo '📦 Installing production dependencies...'
              npm ci --production --prefer-offline --no-audit
            fi
            
            # Ensure PM2 is available
            if ! command -v pm2 &> /dev/null; then
              echo '📦 Installing PM2 globally...'
              npm install -g pm2
            fi
            
            echo '✅ Dependencies configured'
          "

      - name: Configure and start PM2 application
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            cd '${{ needs.prepare.outputs.server_path }}'
            
            # Create PM2 ecosystem configuration
            cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: '${{ env.PM2_APP_NAME }}',
              script: './.output/server/index.mjs',
              instances: 'max',
              exec_mode: 'cluster',
              watch: false,
              env: {
                NODE_ENV: 'production',
                PORT: 3000,
                HOST: '0.0.0.0'
              },
              max_memory_restart: '512M',
              min_uptime: '10s',
              max_restarts: 5,
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
              combine_logs: true,
              merge_logs: true,
              out_file: './logs/out.log',
              error_file: './logs/error.log',
              log_file: './logs/combined.log'
            }]
          };
          EOF
            
            # Create logs directory
            mkdir -p logs
            
            # Stop existing application gracefully
            pm2 stop '${{ env.PM2_APP_NAME }}' 2>/dev/null || true
            pm2 delete '${{ env.PM2_APP_NAME }}' 2>/dev/null || true
            
            # Start the application
            pm2 start ecosystem.config.js
            pm2 save
            
            # Configure PM2 startup (ignore errors if already configured)
            pm2 startup || true
            
            echo '✅ PM2 application configured and started'
          "

  verify:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [prepare, deploy]

    steps:
      - name: Setup SSH connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_SERVER }} >> ~/.ssh/known_hosts

      - name: Wait for application startup
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 30

      - name: Verify PM2 process status
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            # Check PM2 process status
            PM2_STATUS=\$(pm2 jlist | jq -r '.[] | select(.name==\"${{ env.PM2_APP_NAME }}\") | .pm2_env.status' 2>/dev/null)
            
            if [[ \"\$PM2_STATUS\" == \"online\" ]]; then
              echo '✅ PM2 process ${{ env.PM2_APP_NAME }} is online'
              pm2 status
            else
              echo '❌ PM2 process ${{ env.PM2_APP_NAME }} is not online'
              echo 'Current status:' \${PM2_STATUS:-'Not Found'}
              echo '=== PM2 Logs ==='
              pm2 logs '${{ env.PM2_APP_NAME }}' --lines 20 --nostream || true
              exit 1
            fi
          "

      - name: Test direct server connection
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            echo '🔍 Testing direct server connection...'
            RESPONSE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ -m 15)
            
            if [[ \"\$RESPONSE\" == \"200\" ]]; then
              echo '✅ Nuxt server responding on port 3000'
            else
              echo '❌ Nuxt server not responding on port 3000'
              echo 'HTTP Response Code:' \$RESPONSE
              echo '=== PM2 Logs ==='
              pm2 logs '${{ env.PM2_APP_NAME }}' --lines 20 --nostream || true
              exit 1
            fi
          "

      - name: Test domain accessibility
        run: |
          echo "🌐 Testing frontend access via domain..."
          
          # Test with retries
          for i in {1..3}; do
            RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' \
              https://${{ needs.prepare.outputs.domain_name }}/ -m 20)
            
            if [[ "$RESPONSE" == "200" ]]; then
              echo "✅ Frontend accessible via https://${{ needs.prepare.outputs.domain_name }}/"
              break
            elif [[ $i -eq 3 ]]; then
              echo "❌ Frontend not accessible after 3 attempts"
              echo "HTTP Response Code: $RESPONSE"
              exit 1
            else
              echo "⏳ Attempt $i failed (HTTP $RESPONSE), retrying..."
              sleep 10
            fi
          done

      - name: Test API endpoints
        run: |
          echo "🔌 Testing API endpoints..."
          
          # Test API endpoint
          API_RESPONSE=$(curl -s https://${{ needs.prepare.outputs.domain_name }}/api/test-wp -m 15)
          
          if echo "$API_RESPONSE" | grep -q '"endpoint"'; then
            echo "✅ API endpoint responding correctly"
          else
            echo "❌ API endpoint not responding correctly"
            echo "Response preview:" $(echo "$API_RESPONSE" | head -c 200)
            exit 1
          fi

      - name: Test WordPress CMS (if available)
        continue-on-error: true
        run: |
          echo "📝 Testing WordPress CMS access..."
          
          WP_RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' \
            https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/ -m 15)
          
          if [[ "$WP_RESPONSE" == "200" ]]; then
            echo "✅ WordPress accessible"
            
            # Test REST API
            WP_API_RESPONSE=$(curl -s \
              https://${{ needs.prepare.outputs.domain_name }}/${{ env.WP_DIR_NAME }}/wp-json/ -m 15)
            
            if echo "$WP_API_RESPONSE" | grep -q '"name"'; then
              echo "✅ WordPress REST API accessible"
            else
              echo "⚠️ WordPress REST API not responding correctly"
            fi
          else
            echo "⚠️ WordPress not accessible (HTTP $WP_RESPONSE)"
          fi