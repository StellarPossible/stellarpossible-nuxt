name: 🤖 Patchy's Docker Deployment Adventure

on:
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      environment:
        description: '🎯 Where should Patchy deploy?'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_IMAGE_NAME: stellarpossible-nuxt
  CONTAINER_NAME: stellarpossible-app
  DEPLOY_PATH: /var/www/stellarpossible.com
  SERVER_USER: stellaruser

jobs:
  deploy:
    name: 🚀 Patchy's Deployment Mission
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 30
    
    steps:
      - name: 📋 Patchy checks out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Patchy announces the mission
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🤖 *Patchy the GitHub Bot* is starting a new deployment mission!",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    {
                      "title": "🎯 Mission Target",
                      "value": "${{ github.event.inputs.environment || 'production' }}",
                      "short": true
                    },
                    {
                      "title": "📦 Package",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "🔧 Triggered by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "📝 Commit",
                      "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> by ${{ github.actor }}",
                      "short": true
                    }
                  ],
                  "footer": "Patchy is feeling confident about this one! 🎯"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔍 Patchy inspects the codebase
        run: |
          echo "🤖 Patchy says: Let me see what we're working with here..."
          echo "📁 Repository structure:"
          ls -la
          echo ""
          echo "📦 Package.json check:"
          if [[ -f "package.json" ]]; then
            echo "✅ Package.json found - Patchy approves!"
          else
            echo "❌ No package.json? Patchy is confused!"
            exit 1
          fi
          echo ""
          echo "🐳 Docker setup check:"
          if [[ -f "Dockerfile" ]]; then
            echo "✅ Dockerfile found - Patchy loves containers!"
          else
            echo "❌ No Dockerfile? Patchy needs his containers!"
            exit 1
          fi

      - name: 🏗️ Patchy builds the Docker image
        run: |
          echo "🤖 Patchy says: Time to build this beauty!"
          
          # Build the Docker image
          docker build \
            --build-arg NODE_ENV=production \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:latest \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            .
          
          echo "✅ Patchy successfully built the Docker image!"
          
          # Show image info
          docker images ${{ env.DOCKER_IMAGE_NAME }}

      - name: 🧪 Patchy tests the container
        run: |
          echo "🤖 Patchy says: Let's make sure this container actually works!"
          
          # Start the container for testing
          docker run -d \
            --name test-container \
            -p 3001:3000 \
            -e NODE_ENV=production \
            -e WP_USER="admin" \
            -e WP_APP_PASSWORD="test-password" \
            -e WP_GRAPHQL_ENDPOINT="https://stellarpossible.com/cms/graphql" \
            -e WP_REST_ENDPOINT="https://stellarpossible.com/cms/wp-json" \
            -e WP_API_URL="https://stellarpossible.com/cms" \
            -e USE_JWT="${{ secrets.USE_JWT }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Wait for container to start
          echo "⏳ Patchy waits for the container to warm up..."
          sleep 15
          
          # Test the container
          if curl -f http://localhost:3001/ > /dev/null 2>&1; then
            echo "✅ Patchy confirms: Container is responding perfectly!"
          else
            echo "❌ Patchy found a problem: Container is not responding!"
            docker logs test-container
            exit 1
          fi
          
          # Cleanup
          docker stop test-container
          docker rm test-container

      - name: 📦 Patchy saves the Docker image
        run: |
          echo "🤖 Patchy says: Time to package this for shipping!"
          
          # Save Docker image to tar file
          docker save ${{ env.DOCKER_IMAGE_NAME }}:latest | gzip > stellarpossible-docker-image.tar.gz
          
          echo "✅ Patchy has packaged the image for deployment!"
          ls -lh stellarpossible-docker-image.tar.gz

      - name: � Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VPS_SERVER }} $(echo "${{ secrets.SSH_HOST_KEY }}")" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/id_rsa || echo "SSH key added with fingerprint shown above"

      - name: 🚚 Patchy prepares the server
        run: |
          echo "🤖 Patchy is connecting to the server at ${{ secrets.VPS_SERVER }}..."
          
          ssh -o StrictHostKeyChecking=accept-new -v ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} '
            echo "🤖 Patchy has arrived on the server!"
            echo "👤 Running as user: $(whoami)"
            echo "📁 Working in: $(pwd)"
            
            # Navigate to the deployment directory
            cd ${{ env.DEPLOY_PATH }}
            echo "📂 Current directory: $(pwd)"
            echo "📋 Directory contents:"
            ls -la
            
            # Create subdirectory for Nuxt app if it doesn't exist
            mkdir -p nuxt-app
            cd nuxt-app
            
            # Check if Docker is available
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed or not available to this user"
              echo "🤖 Patchy needs Docker to work his magic!"
              exit 1
            fi
            
            # Check if container exists before backup/stop/remove
            if docker ps -a -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
              echo "📦 Patchy is creating a backup of the current deployment..."
              
              # Check if container is running before attempting to commit
              if docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
                echo "📸 Creating backup snapshot..."
                docker commit ${{ env.CONTAINER_NAME }} ${{ env.DOCKER_IMAGE_NAME }}:backup-$(date +%Y%m%d-%H%M%S) || echo "⚠️ Backup creation failed, but continuing deployment..."
              else
                echo "⚠️ Container exists but is not running, skipping backup..."
              fi
              
              # Stop and remove existing container
              echo "🛑 Patchy stops the old container..."
              docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "⚠️ Container already stopped"
              docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "⚠️ Container removal failed, will force remove"
              docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "⚠️ Force removal also failed, continuing anyway..."
            else
              echo "ℹ️ No existing container found, proceeding with fresh deployment..."
            fi
            
            # Remove old images (keep last 3 backups) - with better error handling
            echo "🧹 Patchy cleans up old images..."
            
            # Check if we have any backup images
            BACKUP_COUNT=$(docker images ${{ env.DOCKER_IMAGE_NAME }} --format "{{.Tag}}" | grep -c "backup" || echo "0")
            
            if [ "$BACKUP_COUNT" -gt "3" ]; then
              echo "🧹 Found $BACKUP_COUNT backup images, keeping the newest 3..."
              docker images ${{ env.DOCKER_IMAGE_NAME }} --format "{{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | grep backup | sort -r | tail -n +4 | awk "{print \$1}" | xargs -r docker rmi 2>/dev/null || echo "⚠️ Some images could not be removed, they might be in use"
            else
              echo "ℹ️ Only $BACKUP_COUNT backup images found, no cleanup needed"
            fi
          '

      - name: 📤 Patchy uploads the new image
        run: |
          echo "🤖 Patchy is uploading the Docker image to the server..."
          scp -v stellarpossible-docker-image.tar.gz ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:${{ env.DEPLOY_PATH }}/nuxt-app/
          echo "✅ Image upload complete!"

      - name: 🎯 Patchy deploys the application
        run: |
          echo "🤖 Patchy is deploying the application..."
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} '
            cd ${{ env.DEPLOY_PATH }}/nuxt-app
            
            echo "🤖 Patchy says: Loading the new image..."
            
            # Load the new Docker image
            gunzip -c stellarpossible-docker-image.tar.gz | docker load
            
            # Create environment file with available secrets
            cat > .env << EOF
            # WordPress Configuration (using admin credentials for now)
            WP_USER=admin
            WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
            WP_GRAPHQL_ENDPOINT=https://stellarpossible.com/cms/graphql
            WP_REST_ENDPOINT=https://stellarpossible.com/cms/wp-json
            WP_API_URL=https://stellarpossible.com/cms
            
            # JWT Configuration
            USE_JWT=${{ secrets.USE_JWT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            
            # Application Configuration
            NODE_ENV=production
            NITRO_PORT=3000
            HOST=0.0.0.0
            
            # Admin Configuration
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            EOF
            
            # Create logs directory with proper permissions
            mkdir -p logs
            chmod 755 logs
            
            # Ensure log directory is owned by the right user
            chown -R $(id -u):$(id -g) logs
            
            echo "🚀 Patchy launches the new container..."
            
            # Start the new container with proper error handling
            if docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env \
              -v "$(pwd)/logs:/app/logs" \
              ${{ env.DOCKER_IMAGE_NAME }}:latest; then
              
              echo "✅ Patchy has successfully deployed the application!"
              
              # Verify the container is actually running
              if docker ps -q -f name=${{ env.CONTAINER_NAME }} | grep -q .; then
                echo "✅ Container is confirmed running!"
              else
                echo "❌ Container was created but not running - checking logs:"
                docker logs ${{ env.CONTAINER_NAME }} --tail 20
                exit 1
              fi
            else
              echo "❌ Failed to start container - checking for errors:"
              docker logs ${{ env.CONTAINER_NAME }} --tail 20 2>/dev/null || echo "No logs available"
              exit 1
            fi
            
            # Cleanup the uploaded tar file
            rm -f stellarpossible-docker-image.tar.gz
          '
          echo "📦 Deployment step completed!"

      - name: 🏥 Patchy performs health checks
        run: |
          echo "🤖 Patchy says: Time for the health check!"
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} '
            echo "🤖 Patchy says: Time for the health check!"
            
            # Wait for container to start
            sleep 20
            
            # Check if container is running
            if docker ps -q -f name=${{ env.CONTAINER_NAME }}; then
              echo "✅ Container is running!"
              docker ps -f name=${{ env.CONTAINER_NAME }}
            else
              echo "❌ Container failed to start!"
              echo "🔍 Patchy investigates the logs..."
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            # Test local connection with improved debugging
            echo "🩺 Testing local connection to the application..."
            
            # First, let's check if port 3000 is being listened on
            echo "🔌 Checking if port 3000 is active:"
            netstat -tlnp | grep :3000 || echo "⚠️ Warning: Port 3000 not showing in netstat!"
            
            # Now try connecting to the application
            for i in {1..5}; do
              echo "🧪 Test attempt $i of 5..."
              
              # Use curl with more verbose output for debugging
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ -m 10)
              
              if [[ "$HTTP_CODE" == "200" ]]; then
                echo "✅ Patchy confirms: Application is responding with HTTP 200 OK!"
                break
              else
                echo "⚠️ Received HTTP code $HTTP_CODE instead of 200"
                echo "⏳ Waiting 10 seconds before retry..."
                sleep 10
                
                # On last attempt, provide detailed diagnostics
                if [ $i -eq 5 ]; then
                  echo "❌ Patchy is concerned: Application not responding correctly after 5 attempts!"
                  echo "🔍 Latest container logs:"
                  docker logs ${{ env.CONTAINER_NAME }} --tail 50
                  
                  echo "🔍 Container details:"
                  docker inspect ${{ env.CONTAINER_NAME }} | grep -E "\"Name\"|\"Image\"|\"Status\"|\"Error\""
                  
                  echo "🔍 Process list inside container:"
                  docker exec ${{ env.CONTAINER_NAME }} ps aux 2>/dev/null || echo "Cannot execute process list"
                  
                  # Only fail the build if we get no response at all
                  if [[ "$HTTP_CODE" == "000" ]]; then
                    echo "❌ No response from the application, failing the deployment"
                    exit 1
                  else
                    echo "⚠️ Got HTTP $HTTP_CODE response - not ideal but continuing deployment"
                  fi
                fi
              fi
            done
          '
          echo "✅ Health check completed!"

      - name: 🌐 Patchy tests external access
        run: |
          echo "🤖 Patchy says: Let's see if the world can reach us!"
          
          # Test external access with retries
          for i in {1..3}; do
            RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' https://stellarpossible.com/ -m 30)
            
            if [[ "$RESPONSE" == "200" ]]; then
              echo "✅ Patchy celebrates: External access is working perfectly!"
              break
            elif [[ $i -eq 3 ]]; then
              echo "⚠️ Patchy notes: External access returned HTTP $RESPONSE"
              echo "🤖 This might be due to reverse proxy configuration - checking if app is running locally..."
              # Don't fail the deployment for external access issues
            else
              echo "⏳ Patchy tries again... (Attempt $i, HTTP: $RESPONSE)"
              sleep 15
            fi
          done

      - name: 🔍 Patchy runs final diagnostics
        run: |
          echo "🤖 Patchy is running final diagnostics..."
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} '
            echo "🤖 Patchy says: Running final diagnostics..."
            
            cd ${{ env.DEPLOY_PATH }}/nuxt-app
            
            # Container status
            echo "📊 Container Status:"
            docker ps -f name=${{ env.CONTAINER_NAME }}
            
            # Resource usage
            echo "💾 Resource Usage:"
            docker stats ${{ env.CONTAINER_NAME }} --no-stream
            
            # Recent logs
            echo "📝 Recent Application Logs:"
            docker logs ${{ env.CONTAINER_NAME }} --tail 10
            
            # Test API endpoint with better error handling
            echo "🔌 Testing API endpoint..."
            
            # First check if the API endpoint file exists in the codebase
            if docker exec ${{ env.CONTAINER_NAME }} find /app/.output/server -name "test-wp.*" 2>/dev/null; then
              echo "✅ API endpoint file exists in the deployment"
            else
              echo "⚠️ Could not find the API endpoint file in the deployment - it might have a different path"
            fi
            
            # Now attempt to call the API with timeout and proper error handling
            HTTP_CODE=$(curl -s -o /tmp/api_response.txt -w "%{http_code}" http://localhost:3000/api/test-wp -m 15)
            
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ API endpoint is responding with HTTP 200!"
              echo "Response: $(cat /tmp/api_response.txt)"
              
              if grep -q "endpoint" /tmp/api_response.txt; then
                echo "✅ API response contains expected content!"
              else
                echo "⚠️ API response doesn't contain expected content. This might be fine for a first deployment."
              fi
            else
              echo "⚠️ API endpoint returned HTTP $HTTP_CODE"
              echo "Response (if any): $(cat /tmp/api_response.txt 2>/dev/null || echo "No response body")"
              echo "This might be expected for a first deployment or if the API endpoint is not configured yet."
            fi
            
            # Clean up temp file
            rm -f /tmp/api_response.txt
            
            # Show directory structure
            echo "📁 Deployment structure:"
            echo "Main directory: ${{ env.DEPLOY_PATH }}"
            ls -la ${{ env.DEPLOY_PATH }}
            echo "Nuxt app directory:"
            ls -la ${{ env.DEPLOY_PATH }}/nuxt-app
            
            # Show port usage
            echo "🔌 Port 3000 status:"
            netstat -tlnp | grep :3000 || echo "Port 3000 not in use"
          '
          echo "✅ Diagnostics completed!"

      - name: 🎉 Patchy celebrates success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🎉 *Patchy the GitHub Bot* has successfully completed the deployment mission!",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    {
                      "title": "🎯 Mission Status",
                      "value": "✅ SUCCESSFUL DEPLOYMENT",
                      "short": true
                    },
                    {
                      "title": "🌐 Application",
                      "value": "Running on port 3000",
                      "short": true
                    },
                    {
                      "title": "📦 Version",
                      "value": "`${{ github.sha }}`",
                      "short": true
                    },
                    {
                      "title": "⏱️ Deployment Time",
                      "value": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')",
                      "short": true
                    },
                    {
                      "title": "🔧 Deployed by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "🎯 Environment",
                      "value": "${{ github.event.inputs.environment || 'production' }}",
                      "short": true
                    }
                  ],
                  "footer": "Patchy is doing a happy robot dance! 🤖💃 Container is running smoothly!",
                  "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 😱 Patchy reports failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "😱 *Patchy the GitHub Bot* encountered a problem during deployment!",
              "attachments": [
                {
                  "color": "#ff0000",
                  "fields": [
                    {
                      "title": "🚨 Mission Status",
                      "value": "❌ DEPLOYMENT FAILED",
                      "short": true
                    },
                    {
                      "title": "📦 Failed Version",
                      "value": "`${{ github.sha }}`",
                      "short": true
                    },
                    {
                      "title": "🔧 Attempted by",
                      "value": "${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "⏱️ Failed at",
                      "value": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')",
                      "short": true
                    },
                    {
                      "title": "🎯 Target Environment",
                      "value": "${{ github.event.inputs.environment || 'production' }}",
                      "short": true
                    },
                    {
                      "title": "📊 Workflow Run",
                      "value": "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>",
                      "short": true
                    }
                  ],
                  "footer": "Patchy is feeling a bit glitchy... 🤖💥 Time to debug!",
                  "footer_icon": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}