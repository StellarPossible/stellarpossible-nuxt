# .github/workflows/release.yaml
# Comprehensive deployment workflow for StellarPossible Nuxt application with Headless WordPress
name: Deploy StellarPossible Platform

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'


env:
  NODE_VERSION: '20'
  PM2_APP_NAME: 'stellarpossible-nuxt'
  WP_DIR_NAME: 'cms'
  REMOTE_BASE_PATH: '/var/www/stellarpossible.com'
  DOMAIN_NAME: 'stellarpossible.com'

jobs:
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      server_path: ${{ steps.config.outputs.server_path }}
      app_version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Set configuration values
        id: config
        run: |
          if [[ "${{ github.event.inputs.environment || 'production' }}" == "staging" ]]; then
            echo "server_path=/var/www/staging.stellarpossible.com" >> $GITHUB_OUTPUT
            echo "REMOTE_BASE_PATH=/var/www/staging.stellarpossible.com" >> $GITHUB_ENV
            echo "DOMAIN_NAME=staging.stellarpossible.com" >> $GITHUB_ENV
          else
            echo "server_path=/var/www/stellarpossible.com" >> $GITHUB_OUTPUT
            echo "REMOTE_BASE_PATH=/var/www/stellarpossible.com" >> $GITHUB_ENV
            echo "DOMAIN_NAME=stellarpossible.com" >> $GITHUB_ENV
          fi
      
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi
  
  build:
    name: Build Nuxt Application
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Nuxt Application
        run: |
          echo "Building Nuxt application with domain: ${{ env.DOMAIN_NAME }}"
          npm run build
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_GRAPHQL_ENDPOINT: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/graphql
          WP_REST_ENDPOINT: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/wp-json
          WP_API_URL: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}
          USE_JWT: ${{ secrets.USE_JWT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
      
      - name: Create version file
        run: |
          VERSION_FILE=.output/public/VERSION.txt
          echo "Version: ${{ needs.prepare.outputs.app_version }}" > $VERSION_FILE
          echo "Commit: ${{ github.sha }}" >> $VERSION_FILE
          echo "Branch: ${{ github.ref_name }}" >> $VERSION_FILE
          echo "Built at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $VERSION_FILE
          echo "Built by: GitHub Actions" >> $VERSION_FILE
          
          cat $VERSION_FILE
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: .output
          retention-days: 1
  

  
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.build.result == 'success'
    
    steps:
      - name: Checkout repository for configuration files
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuxt-build
          path: .output
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_SERVER }} >> ~/.ssh/known_hosts
      
      - name: Backup WordPress if exists
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} '
          BACKUP_PATH="${{ needs.prepare.outputs.server_path }}/backups"
          CMS_PATH="${{ needs.prepare.outputs.server_path }}/${{ env.WP_DIR_NAME }}"
          
          # Create backups directory if it doesn't exist
          mkdir -p "$BACKUP_PATH"
          
          # If WordPress is installed, back it up
          if [ -f "${CMS_PATH}/wp-config.php" ]; then
            echo "Creating WordPress backup..."
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_FILE="$BACKUP_PATH/wp-backup-$TIMESTAMP.tar.gz"
            
            # Create backup
            tar -czf "$BACKUP_FILE" -C "$CMS_PATH" . || echo "Warning: Some files were not included in the backup"
            
            echo "WordPress backup created: $BACKUP_FILE"
            
            # Keep only the latest 3 backups
            ls -tp "$BACKUP_PATH"/wp-backup-*.tar.gz | grep -v "/$" | tail -n +4 | xargs -I {} rm -- {}
          else
            echo "WordPress installation not found at $CMS_PATH"
          fi
          '
      
      - name: Deploy Nuxt application
        run: |
          echo "Deploying to ${{ needs.prepare.outputs.server_path }}"
          
          # Upload Nuxt build files
          rsync -avz --delete \
            --exclude="/${{ env.WP_DIR_NAME }}/" \
            --exclude="/backups/" \
            .output/ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:${{ needs.prepare.outputs.server_path }}
          
          # Create .env file on server
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
          cat > ${{ needs.prepare.outputs.server_path }}/.env << 'EOF'
          WP_USER=${{ secrets.WP_USER }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          WP_GRAPHQL_ENDPOINT=https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/graphql
          WP_REST_ENDPOINT=https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/wp-json
          WP_API_URL=https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}
          USE_JWT=${{ secrets.USE_JWT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          NITRO_PORT=3000
          HOST=0.0.0.0
          EOF
          "
      
      - name: Install production dependencies
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
          cd ${{ needs.prepare.outputs.server_path }}
          
          # Install production dependencies
          npm ci --production
          "
      
      - name: Configure and start PM2
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
          cd ${{ needs.prepare.outputs.server_path }}
          
          # Create PM2 ecosystem file
          cat > ecosystem.config.js << 'EOF'
          module.exports = {
            apps: [{
              name: '${{ env.PM2_APP_NAME }}',
              script: './.output/server/index.mjs',
              instances: 'max',
              exec_mode: 'cluster',
              watch: false,
              env: {
                PORT: 3000,
                NODE_ENV: 'production',
              },
              max_memory_restart: '500M',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
              combine_logs: true,
            }]
          };
          EOF
          
          # Restart application using PM2
          pm2 delete ${{ env.PM2_APP_NAME }} || true
          pm2 start ecosystem.config.js
          pm2 save
          
          # Ensure PM2 starts on system boot
          pm2 startup | tail -n 1 | bash || true
          "
  
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_SERVER }} >> ~/.ssh/known_hosts
      
      - name: Check PM2 process status
        run: |
          echo "Checking PM2 process status..."
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
          # Check if process is running
          PM2_STATUS=\$(pm2 jlist | jq -r '.[] | select(.name==\"${{ env.PM2_APP_NAME }}\") | .pm2_env.status' 2>/dev/null)
          
          if [ \"\$PM2_STATUS\" = \"online\" ]; then
            echo '✅ PM2 process ${{ env.PM2_APP_NAME }} is online'
            pm2 status
            exit 0
          else
            echo '❌ ERROR: PM2 process ${{ env.PM2_APP_NAME }} is not online'
            echo 'Current status: ' \${PM2_STATUS:-'Not Found'}
            echo '=== PM2 Error Logs ==='
            pm2 logs ${{ env.PM2_APP_NAME }} --lines 20 --nostream || true
            exit 1
          fi
          "
      
      - name: Check Nuxt server direct connection
        run: |
          echo "Testing Nuxt server direct connection..."
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
          # Test direct server connection
          RESPONSE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ -m 10)
          
          if [ \"\$RESPONSE\" = \"200\" ]; then
            echo '✅ Nuxt server responding on port 3000'
            exit 0
          else
            echo '❌ ERROR: Nuxt server not responding on port 3000'
            echo 'HTTP Response Code:' \$RESPONSE
            echo '=== PM2 Logs ==='
            pm2 logs ${{ env.PM2_APP_NAME }} --lines 20 --nostream || true
            exit 1
          fi
          "
      
      - name: Test Frontend and API access
        run: |
          echo "Testing frontend access via HTTPS..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.DOMAIN_NAME }}/ -m 15)
          
          if [ "$FRONTEND_STATUS" = "200" ]; then
            echo '✅ Frontend is accessible via https://${{ env.DOMAIN_NAME }}/'
          else
            echo '❌ ERROR: Frontend is not accessible via domain'
            echo 'HTTP Response Code:' $FRONTEND_STATUS
            exit 1
          fi
          
          echo "Testing API access..."
          API_RESPONSE=$(curl -s https://${{ env.DOMAIN_NAME }}/api/test-wp -m 15)
          
          if echo "$API_RESPONSE" | grep -q '"endpoint"'; then
            echo '✅ API accessible via domain'
          else
            echo '❌ ERROR: API not accessible or returning unexpected response'
            echo 'Response:' $(echo "$API_RESPONSE" | head -c 200)
            exit 1
          fi
      
      - name: Test WordPress access
        run: |
          echo "Testing WordPress access..."
          
          WP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/ -m 15)
          
          if [ "$WP_STATUS" = "200" ]; then
            echo '✅ WordPress is accessible via https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/'
          else
            echo '⚠️ WARNING: WordPress may not be accessible'
            echo 'HTTP Response Code:' $WP_STATUS
          fi
          
          # Test WordPress REST API
          WP_API_RESPONSE=$(curl -s https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/wp-json/ -m 15)
          
          if echo "$WP_API_RESPONSE" | grep -q '"name"'; then
            echo '✅ WordPress REST API accessible'
          else
            echo '⚠️ WARNING: WordPress REST API may not be accessible'
            echo 'Response:' $(echo "$WP_API_RESPONSE" | head -c 200)
          fi
  
  notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [prepare, deploy, verify]
    if: always()
    
    steps:
      - name: Check overall status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" && "${{ needs.verify.result }}" == "success" ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "status_text=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "status_text=FAILED" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate deployment report
        run: |
          cat > deployment-report.txt << EOF
          # Deployment Report: ${{ steps.status.outputs.status_text }}
          
          ## Application Details
          - Version: ${{ needs.prepare.outputs.app_version }}
          - Environment: ${{ github.event.inputs.environment || 'production' }}
          - Domain: ${{ env.DOMAIN_NAME }}
          - Deployed on: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          ## Server Configuration
          - Path: ${{ needs.prepare.outputs.server_path }}
          - PM2 App Name: ${{ env.PM2_APP_NAME }}
          
          ## Deployment Results
          - Build: ${{ needs.build.result }}
          - Deploy: ${{ needs.deploy.result }}
          - Verification: ${{ needs.verify.result }}
          
          ## URLs
          - Frontend: https://${{ env.DOMAIN_NAME }}/
          - API Example: https://${{ env.DOMAIN_NAME }}/api/test-wp
          - WordPress Admin: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/wp-admin/
          - WordPress REST API: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/wp-json/
          - WordPress GraphQL: https://${{ env.DOMAIN_NAME }}/${{ env.WP_DIR_NAME }}/graphql
          
          ## How to manage the server
          - View PM2 processes: \`pm2 status\`
          - View application logs: \`pm2 logs ${{ env.PM2_APP_NAME }}\`
          - Restart application: \`pm2 restart ${{ env.PM2_APP_NAME }}\`
          - Monitor resources: \`pm2 monit\`
          
          ## Troubleshooting
          - Check Nginx logs: \`sudo tail -f /var/log/nginx/access.log /var/log/nginx/error.log\`
          - Check application logs: \`pm2 logs ${{ env.PM2_APP_NAME }} --lines 50\`
          - Restart Nginx: \`sudo systemctl restart nginx\`
          - Test Nuxt locally: \`curl http://localhost:3000/\`
          
          ## Webhook triggered by
          - User: ${{ github.actor }}
          - Event: ${{ github.event_name }}
          - Repository: ${{ github.repository }}
          EOF
      
      - name: Send notification
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"Deployment successful!"}' \
              ${{ secrets.SLACK_WEBHOOK_URL }}
          else
            echo "⚠️ SLACK_WEBHOOK_URL is not set. Skipping notification."
          fi


      # Setup SSH key for secure authentication
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_SERVER }} >> ~/.ssh/known_hosts

      # Backup WordPress CMS (preserve headless backend)
      - name: Backup WordPress CMS
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          CMS_PATH="${REMOTE_PATH}cms/"
          echo "Creating backup of WordPress CMS..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "if [ -f '${CMS_PATH}wp-config.php' ]; then \
              echo 'Backing up WordPress CMS from /cms directory...' && \
              mkdir -p backups && \
              sudo tar -czf backups/wp-cms-backup-$(date +%Y%m%d-%H%M%S).tar.gz \
                -C '${CMS_PATH}' \
                . \
                2>/dev/null || echo 'CMS backup completed with warnings'; \
            else \
              echo '❌ WARNING: WordPress CMS not found at expected location ${CMS_PATH}'; \
              echo 'No WordPress CMS backup created.'; \
            fi"

      # Deploy Nuxt application to website root
      - name: Deploy Nuxt Frontend Application
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          echo "Deploying Nuxt frontend, preserving the /cms and /backups directories..."
          rsync -avz \
            --delete \
            --exclude='/cms/' \
            --exclude='/backups/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.nvmrc' \
            --exclude='.vscode/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            . \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:$REMOTE_PATH

      # Set up environment variables
      - name: Configure Environment Variables
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "cd $REMOTE_PATH && \
            cat > .env << 'EOF'
          WP_USER=${{ secrets.WP_USER }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          WP_GRAPHQL_ENDPOINT=https://stellarpossible.com/cms/graphql
          WP_REST_ENDPOINT=https://stellarpossible.com/cms/wp-json
          WP_API_URL=https://stellarpossible.com/cms
          USE_JWT=${{ secrets.USE_JWT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          NITRO_PORT=3000
          HOST=0.0.0.0
          EOF"

      # Install dependencies and start Nuxt server
      - name: Install Dependencies and Start Nuxt Server
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "cd $REMOTE_PATH && \
            echo 'Setting up Node.js environment...' && \
            # Install Node.js 20 using NodeSource repository if not already installed
            if ! command -v node &> /dev/null; then \
              echo 'Installing Node.js 20...' && \
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && \
              sudo apt-get install -y nodejs; \
            else \
              echo 'Node.js already installed:' \$(node --version); \
            fi && \
            # Ensure npm is available
            export PATH=\$PATH:/usr/bin:/usr/local/bin && \
            echo 'Node version:' \$(node --version) && \
            echo 'NPM version:' \$(npm --version) && \
            echo 'Installing production dependencies...' && \
            npm install --production && \
            echo 'Ensuring PM2 is installed globally...' && \
            npm install -g pm2 && \
            # Add npm global bin to PATH permanently
            export PATH=\$PATH:\$(npm config get prefix)/bin && \
            echo 'export PATH=\$PATH:\$(npm config get prefix)/bin' >> ~/.bashrc && \
            echo 'PM2 version:' \$(pm2 --version) && \
            echo 'Stopping existing Nuxt frontend if running...' && \
            pm2 stop nuxt-frontend 2>/dev/null || true && \
            pm2 delete nuxt-frontend 2>/dev/null || true && \
            echo 'Starting Nuxt frontend server...' && \
            pm2 start .output/server/index.mjs --name nuxt-frontend --env production && \
            pm2 save && \
            echo 'Setting up PM2 startup...' && \
            pm2 startup || true"

      # Configure web server routing
      - name: Configure Web Server Routing
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "cd $REMOTE_PATH && \
            echo 'RewriteEngine On' > .htaccess && \
            echo '' >> .htaccess && \
            echo '# WordPress CMS routes (preserve /cms directory access)' >> .htaccess && \
            echo 'RewriteRule ^cms/(.*)$ cms/\$1 [L]' >> .htaccess && \
            echo '' >> .htaccess && \
            echo '# Preserve access to /backups if it exists' >> .htaccess && \
            echo 'RewriteRule ^backups/(.*)$ backups/\$1 [L]' >> .htaccess && \
            echo '' >> .htaccess && \
            echo '# Proxy all other requests to Nuxt frontend server' >> .htaccess && \
            echo 'RewriteCond %{REQUEST_URI} !^/cms/' >> .htaccess && \
            echo 'RewriteCond %{REQUEST_URI} !^/backups/' >> .htaccess && \
            echo 'RewriteCond %{REQUEST_FILENAME} !-f' >> .htaccess && \
            echo 'RewriteCond %{REQUEST_FILENAME} !-d' >> .htaccess && \
            echo 'RewriteRule ^(.*)$ http://127.0.0.1:3000/\$1 [P,L]' >> .htaccess && \
            echo '' >> .htaccess && \
            echo '# Handle API routes specifically' >> .htaccess && \
            echo 'RewriteRule ^api/(.*)$ http://127.0.0.1:3000/api/\$1 [P,L]' >> .htaccess && \
            echo '' >> .htaccess && \
            echo '# Prevent access to sensitive WordPress files in cms directory' >> .htaccess && \
            echo '<FilesMatch \"^\.ht|wp-config\.php$\">' >> .htaccess && \
            echo '  Order Allow,Deny' >> .htaccess && \
            echo '  Deny from all' >> .htaccess && \
            echo '</FilesMatch>' >> .htaccess"

     # CRITICAL: Wait and verify PM2 process is running
      - name: Verify PM2 Process Status
        run: |
          echo "Waiting for Nuxt frontend to start..."
          sleep 15
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "export PATH=\$PATH:/usr/bin:/usr/local/bin:\$(npm config get prefix)/bin 2>/dev/null || export PATH=\$PATH:/usr/bin:/usr/local/bin && \
            PM2_STATUS=\$(pm2 jlist | jq -r '.[] | select(.name==\"nuxt-frontend\") | .pm2_env.status' 2>/dev/null) && \
            if [ \"\$PM2_STATUS\" = \"online\" ]; then \
              echo '✅ PM2 process nuxt-frontend is online'; \
              pm2 status; \
            else \
              echo '❌ CRITICAL ERROR: PM2 process nuxt-frontend is not online'; \
              echo 'Current status: ' \${PM2_STATUS:-'Not Found'}; \
              echo '=== PM2 Error Logs ==='; \
              pm2 logs nuxt-frontend --lines 20 --nostream || true; \
              exit 1; \
            fi"

      # CRITICAL: Verify Nuxt server files exist
      - name: Verify Nuxt Server Files
        run: |
          REMOTE_PATH="/var/www/stellarpossible.com/"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "cd $REMOTE_PATH && \
            if [ ! -f .output/server/index.mjs ]; then \
              echo '❌ CRITICAL ERROR: Nuxt server file (.output/server/index.mjs) not found'; \
              exit 1; \
            fi && \
            if [ ! -d .output/server/chunks ]; then \
              echo '❌ CRITICAL ERROR: Nuxt server chunks not found'; \
              exit 1; \
            fi && \
            echo '✅ Nuxt server files verified'"

      # CRITICAL: Wait and verify PM2 process is running
      - name: Verify PM2 Process Status
        run: |
          echo "Waiting for Nuxt frontend to start..."
          sleep 15
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "PM2_STATUS=\$(pm2 jlist | jq -r '.[] | select(.name==\"nuxt-frontend\") | .pm2_env.status' 2>/dev/null) && \
            if [ \"\$PM2_STATUS\" = \"online\" ]; then \
              echo '✅ PM2 process nuxt-frontend is online'; \
              pm2 status; \
            else \
              echo '❌ CRITICAL ERROR: PM2 process nuxt-frontend is not online'; \
              echo 'Current status: ' \${PM2_STATUS:-'Not Found'}; \
              echo '=== PM2 Error Logs ==='; \
              pm2 logs nuxt-frontend --lines 20 --nostream || true; \
              exit 1; \
            fi"

       # CRITICAL: Test Nuxt server direct connection
      - name: Test Nuxt Server Direct Connection
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "export PATH=\$PATH:\$(npm config get prefix)/bin && \
            echo 'Testing direct server connection on port 3000...' && \
            RESPONSE=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ -m 10) && \
            if [ \"\$RESPONSE\" = \"200\" ]; then \
              echo '✅ Nuxt server responding on port 3000'; \
            else \
              echo '❌ CRITICAL ERROR: Nuxt server not responding on port 3000'; \
              echo 'HTTP Response Code:' \$RESPONSE; \
              echo '=== PM2 Logs ==='; \
              pm2 logs nuxt-frontend --lines 20 --nostream || true; \
              exit 1; \
            fi"

      # CRITICAL: Test API endpoints return JSON
      - name: Test API Endpoints Return JSON
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "echo 'Testing /api/test-wp endpoint...' && \
            RESPONSE=\$(curl -s http://127.0.0.1:3000/api/test-wp -m 10) && \
            if echo \"\$RESPONSE\" | grep -q '\"endpoint\"'; then \
              echo '✅ API endpoint returns JSON response'; \
              echo 'Sample response:' \$(echo \"\$RESPONSE\" | head -c 100)...; \
            elif echo \"\$RESPONSE\" | grep -q '<html>'; then \
              echo '❌ CRITICAL ERROR: API endpoint returning HTML instead of JSON'; \
              echo 'This indicates server-side routing is not working properly'; \
              echo 'Response preview:' \$(echo \"\$RESPONSE\" | head -c 200); \
              exit 1; \
            else \
              echo '❌ CRITICAL ERROR: API endpoint returning unexpected response'; \
              echo 'Response:' \$(echo \"\$RESPONSE\" | head -c 200); \
              exit 1; \
            fi"

      # CRITICAL: Test WordPress CMS API accessibility
      - name: Test WordPress CMS API Access
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "echo 'Testing WordPress REST API at /cms...' && \
            RESPONSE=\$(curl -s https://stellarpossible.com/cms/wp-json/ -m 10) && \
            if echo \"\$RESPONSE\" | grep -q '\"name\"'; then \
              echo '✅ WordPress REST API accessible at /cms'; \
              echo 'Site name:' \$(echo \"\$RESPONSE\" | jq -r '.name' 2>/dev/null || echo 'Could not parse name'); \
            else \
              echo '❌ CRITICAL ERROR: WordPress REST API not accessible at /cms'; \
              echo 'Response:' \$(echo \"\$RESPONSE\" | head -c 200); \
              echo 'Checking if WordPress is properly installed in the cms directory...'; \
              if [ -f /var/www/stellarpossible.com/cms/wp-config.php ]; then \
                echo 'WordPress files found but API is not responding correctly. Check WP configuration.'; \
              else \
                echo 'WordPress files not found at expected location. Please verify the installation path.'; \
              fi; \
              exit 1; \
            fi"

      # CRITICAL: Test frontend proxy routing
      - name: Test Frontend Proxy Routing
        run: |
          echo "Testing frontend proxy routing..."
          RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' https://stellarpossible.com/ -m 15)
          if [ "$RESPONSE" = "200" ]; then
            echo '✅ Frontend is accessible via https://stellarpossible.com';
          else
            echo '❌ CRITICAL ERROR: Frontend is not accessible via domain';
            echo 'HTTP Response Code:' $RESPONSE;
            echo 'Check .htaccess configuration and PM2 logs.';
            exit 1;
          fi

      # CRITICAL: Test API proxy routing
      - name: Test API Proxy Routing
        run: |
          echo "Testing API proxy routing..."
          RESPONSE=$(curl -s https://stellarpossible.com/api/test-wp -m 15)
          if echo "$RESPONSE" | grep -q '"endpoint"'; then
            echo '✅ API proxy routing working - API accessible via domain';
          elif echo "$RESPONSE" | grep -q '<html>'; then
            echo '❌ CRITICAL ERROR: API proxy routing failed - getting HTML instead of JSON';
            echo 'Check .htaccess configuration';
            exit 1;
          else
            echo '❌ CRITICAL ERROR: API proxy routing failed - unexpected response';
            echo 'Response:' $(echo "$RESPONSE" | head -c 200);
            exit 1;
          fi

      # Clean up SSH key for security
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      # Log deployment completion details
      - name: Deployment Summary
        run: |
          echo "✅ Headless CMS + Nuxt Frontend deployment completed successfully!"
          echo "🧪 All critical tests passed!"
          echo "📦 Version: ${{ github.event.release.tag_name }} is live!"
          echo ""
          echo "🏗️  Architecture:"
          echo "   Frontend: Nuxt.js (https://stellarpossible.com)"
          echo "   CMS: WordPress Headless (https://stellarpossible.com/cms)"
          echo "   Hostinger Path: stellarpossible.com > public_html > cms (WordPress files)"
          echo ""
          echo "🌐 URLs:"
          echo "   🎨 Website: https://stellarpossible.com"
          echo "   ⚙️  CMS Admin: https://stellarpossible.com/cms/wp-admin"
          echo "   📡 REST API: https://stellarpossible.com/cms/wp-json"
          echo "   🔗 GraphQL: https://stellarpossible.com/cms/graphql"
          echo ""
          echo "🔐 Nuxt API Endpoints:"
          echo "   - https://stellarpossible.com/api/auth/login"
          echo "   - https://stellarpossible.com/api/auth/me"
          echo "   - https://stellarpossible.com/api/auth/register"
          echo "   - https://stellarpossible.com/api/test-wp"
          echo ""
          echo "📋 Management:"
          echo "   pm2 status"
          echo "   pm2 logs nuxt-frontend"
          echo "   pm2 restart nuxt-frontend"