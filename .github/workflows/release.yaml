name: 🤖 Patchy's Docker Deployment Adventure

on:
  push:
    branches: [main]
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      environment:
        description: '🎯 Where should Patchy deploy?'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_IMAGE_NAME: stellarpossible-nuxt
  CONTAINER_NAME: stellarpossible-app
  DEPLOY_PATH: /var/www/stellarpossible.com
  SERVER_USER: stellaruser

jobs:
  deploy:
    name: 🚀 Patchy's Deployment Mission
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 30
    
    steps:
      - name: 📋 Patchy checks out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh
          chmod +x .github/scripts/utils/*.sh
          ls -la .github/scripts/

      - name: 🤖 Patchy announces the mission
        run: |
          source .github/scripts/utils/slack-notify.sh
          send_deployment_start \
            "${{ github.event.inputs.environment || 'production' }}" \
            "${{ github.repository }}" \
            "${{ github.actor }}" \
            "${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔍 Patchy inspects the codebase
        run: |
          echo "🤖 Patchy says: Let me see what we're working with here..."
          echo "📁 Repository structure:"
          ls -la
          echo ""
          echo "📦 Package.json check:"
          if [[ -f "package.json" ]]; then
            echo "✅ Package.json found - Patchy approves!"
          else
            echo "❌ No package.json? Patchy is confused!"
            exit 1
          fi
          echo ""
          echo "🐳 Docker setup check:"
          if [[ -f "Dockerfile" ]]; then
            echo "✅ Dockerfile found - Patchy loves containers!"
          else
            echo "❌ No Dockerfile? Patchy needs his containers!"
            exit 1
          fi

      - name: 🏗️ Patchy builds the Docker image
        run: |
          .github/scripts/build-image.sh
        env:
          IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          TAG: latest
          GIT_SHA: ${{ github.sha }}
          SAVE_IMAGE: "true"

      - name: 🧪 Patchy tests the container
        run: |
          .github/scripts/test-container.sh
        env:
          IMAGE_NAME: ${{ env.DOCKER_IMAGE_NAME }}
          TAG: latest
          TEST_PORT: 3001
          WAIT_TIME: 15
          MAX_RETRIES: 3
          WP_USER: "admin"
          WP_APP_PASSWORD: "test-password"
          WP_GRAPHQL_ENDPOINT: "https://stellarpossible.com/cms/graphql"
          WP_REST_ENDPOINT: "https://stellarpossible.com/cms/wp-json"
          WP_API_URL: "https://stellarpossible.com/cms"
          USE_JWT: ${{ secrets.USE_JWT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: 🔑 Patchy sets up SSH
        run: |
          .github/scripts/simple-ssh-setup.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_SERVER: ${{ secrets.VPS_SERVER }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}

      - name: 🚚 Patchy prepares the server
        run: |
          # Create a temporary script file
          cat > prepare-server-temp.sh << 'EOL'
          #!/bin/bash
          # Check if Docker socket exists and user has access
          if [ -e /var/run/docker.sock ]; then
            if [ -w /var/run/docker.sock ]; then
              echo "✅ User has direct access to Docker socket"
            elif groups | grep -q docker; then
              echo "✅ User is in docker group"
            else
              echo "⚠️ Docker permission issue detected, trying to continue anyway..."
            fi
          fi
          
          # Set DOCKER_CMD for use in the script
          export DOCKER_CMD="docker"
          
          # Import and run the main script with variables set
          export CONTAINER_NAME=${CONTAINER_NAME}
          export IMAGE_NAME=${IMAGE_NAME}
          export DEPLOY_PATH=${DEPLOY_PATH}
          export APP_DIR=${APP_DIR}
          
          # Run the script
          ${PREPARE_SCRIPT}
          EOL
          
          # Make the script executable
          chmod +x prepare-server-temp.sh
          
          # Send the script to the server
          scp prepare-server-temp.sh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:/tmp/
          
          # Get the content of the prepare-server.sh script
          PREPARE_CONTENT=$(cat .github/scripts/prepare-server.sh)
          
          # Execute the script on the remote server
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            export CONTAINER_NAME=${{ env.CONTAINER_NAME }}
            export IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }}
            export DEPLOY_PATH=${{ env.DEPLOY_PATH }}
            export APP_DIR=nuxt-app
            export PREPARE_SCRIPT='$PREPARE_CONTENT'
            
            bash /tmp/prepare-server-temp.sh
          "
          
          # Clean up
          rm prepare-server-temp.sh

      - name: 📤 Patchy uploads the new image
        run: |
          TARFILE="${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz"
          echo "🤖 Patchy is uploading the Docker image to the server..."
          scp -v "$TARFILE" ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:${{ env.DEPLOY_PATH }}/nuxt-app/
          echo "✅ Image upload complete!"

      - name: 🎯 Patchy deploys the application
        run: |
          # Create a temporary script file
          cat > deploy-app-temp.sh << 'EOL'
          #!/bin/bash
          # Check if Docker socket exists and user has access
          if [ -e /var/run/docker.sock ]; then
            if [ -w /var/run/docker.sock ]; then
              echo "✅ User has direct access to Docker socket"
            elif groups | grep -q docker; then
              echo "✅ User is in docker group"
            else
              echo "⚠️ Docker permission issue detected, trying to continue anyway..."
            fi
          fi
          
          # Set DOCKER_CMD for use in the script
          export DOCKER_CMD="docker"
          
          # Import and run the main script with variables set
          export CONTAINER_NAME=${CONTAINER_NAME}
          export IMAGE_NAME=${IMAGE_NAME}
          export TAG=${TAG}
          export DEPLOY_PATH=${DEPLOY_PATH}
          export APP_DIR=${APP_DIR}
          export TAR_FILE=${TAR_FILE}
          
          # Set WordPress variables
          export WP_USER=${WP_USER}
          export WP_APP_PASSWORD=${WP_APP_PASSWORD}
          export WP_GRAPHQL_ENDPOINT=${WP_GRAPHQL_ENDPOINT}
          export WP_REST_ENDPOINT=${WP_REST_ENDPOINT}
          export WP_API_URL=${WP_API_URL}
          export USE_JWT=${USE_JWT}
          export JWT_SECRET=${JWT_SECRET}
          export ADMIN_EMAIL=${ADMIN_EMAIL}
          
          # Run the script
          ${DEPLOY_SCRIPT}
          EOL
          
          # Make the script executable
          chmod +x deploy-app-temp.sh
          
          # Send the script to the server
          scp deploy-app-temp.sh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:/tmp/
          
          # Get the content of the deploy-app.sh script
          DEPLOY_CONTENT=$(cat .github/scripts/deploy-app.sh)
          
          # Execute the script on the remote server
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            export CONTAINER_NAME=${{ env.CONTAINER_NAME }}
            export IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }}
            export TAG=latest
            export DEPLOY_PATH=${{ env.DEPLOY_PATH }}
            export APP_DIR=nuxt-app
            export TAR_FILE=${{ env.DOCKER_IMAGE_NAME }}-${{ github.sha }}.tar.gz
            
            # Set environment variables
            export WP_USER=admin
            export WP_APP_PASSWORD='${{ secrets.WP_APP_PASSWORD }}'
            export WP_GRAPHQL_ENDPOINT=https://stellarpossible.com/cms/graphql
            export WP_REST_ENDPOINT=https://stellarpossible.com/cms/wp-json
            export WP_API_URL=https://stellarpossible.com/cms
            export USE_JWT='${{ secrets.USE_JWT }}'
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export ADMIN_EMAIL='${{ secrets.ADMIN_EMAIL }}'
            export DEPLOY_SCRIPT='$DEPLOY_CONTENT'
            
            bash /tmp/deploy-app-temp.sh
          "
          
          # Clean up
          rm deploy-app-temp.sh

      - name: 🏥 Patchy performs health checks
        run: |
          # Create a temporary script file
          cat > health-check-temp.sh << 'EOL'
          #!/bin/bash
          # Check if Docker socket exists and user has access
          if [ -e /var/run/docker.sock ]; then
            if [ -w /var/run/docker.sock ]; then
              echo "✅ User has direct access to Docker socket"
            elif groups | grep -q docker; then
              echo "✅ User is in docker group"
            else
              echo "⚠️ Docker permission issue detected, trying to continue anyway..."
            fi
          fi
          
          # Set DOCKER_CMD for use in the script
          export DOCKER_CMD="docker"
          
          # Import and run the main script with variables set
          export CONTAINER_NAME=${CONTAINER_NAME}
          export HOST=${HOST}
          export PORT=${PORT}
          export RETRIES=${RETRIES}
          export DELAY=${DELAY}
          
          # Run the script
          ${HEALTH_SCRIPT}
          EOL
          
          # Make the script executable
          chmod +x health-check-temp.sh
          
          # Send the script to the server
          scp health-check-temp.sh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:/tmp/
          
          # Get the content of the health-check.sh script
          HEALTH_CONTENT=$(cat .github/scripts/health-check.sh)
          
          # Execute the script on the remote server
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            export CONTAINER_NAME=${{ env.CONTAINER_NAME }}
            export HOST=localhost
            export PORT=3000
            export RETRIES=5
            export DELAY=10
            export HEALTH_SCRIPT='$HEALTH_CONTENT'
            
            bash /tmp/health-check-temp.sh
          "
          
          # Clean up
          rm health-check-temp.sh

      - name: 🌐 Patchy tests external access
        run: |
          echo "🤖 Patchy says: Let's see if the world can reach us!"
          
          # Test external access with retries
          for i in {1..3}; do
            RESPONSE=$(curl -s -o /dev/null -w '%{http_code}' https://stellarpossible.com/ -m 30)
            
            if [[ "$RESPONSE" == "200" ]]; then
              echo "✅ Patchy celebrates: External access is working perfectly!"
              break
            elif [[ $i -eq 3 ]]; then
              echo "⚠️ Patchy notes: External access returned HTTP $RESPONSE"
              echo "🤖 This might be due to reverse proxy configuration - checking if app is running locally..."
              # Don't fail the deployment for external access issues
            else
              echo "⏳ Patchy tries again... (Attempt $i, HTTP: $RESPONSE)"
              sleep 15
            fi
          done

      - name: 🔍 Patchy runs final diagnostics
        run: |
          # Create a temporary diagnostics script file
          cat > diagnostics-temp.sh << 'EOL'
          #!/bin/bash
          
          echo '🤖 Patchy says: Running final diagnostics...'
          
          cd ${DEPLOY_PATH}/${APP_DIR}
          
          # Check if Docker socket exists and user has access
          if [ -e /var/run/docker.sock ]; then
            if [ -w /var/run/docker.sock ]; then
              echo "✅ User has direct access to Docker socket"
              DOCKER_CMD="docker"
            elif groups | grep -q docker; then
              echo "✅ User is in docker group"
              DOCKER_CMD="docker"
            else
              echo "⚠️ Docker permission issue detected, trying docker commands anyway..."
              DOCKER_CMD="docker"
              # Try sudo if available without password prompt
              if sudo -n true 2>/dev/null; then
                echo "✅ Non-interactive sudo is available, using sudo docker"
                DOCKER_CMD="sudo docker"
              fi
            fi
          fi
          
          # Container status
          echo '📊 Container Status:'
          $DOCKER_CMD ps -f name=${CONTAINER_NAME} || echo "Failed to get container status"
          
          # Resource usage
          echo '💾 Resource Usage:'
          $DOCKER_CMD stats ${CONTAINER_NAME} --no-stream || echo "Failed to get resource usage"
          
          # Recent logs
          echo '📝 Recent Application Logs:'
          $DOCKER_CMD logs ${CONTAINER_NAME} --tail 10 || echo "Failed to get container logs"
          
          # Show directory structure
          echo '📁 Deployment structure:'
          echo "Main directory: ${DEPLOY_PATH}"
          ls -la ${DEPLOY_PATH} || echo "Failed to list deployment directory"
          echo "Nuxt app directory:"
          ls -la ${DEPLOY_PATH}/${APP_DIR} || echo "Failed to list app directory"
          
          # Show port usage
          echo '🔌 Port 3000 status:'
          netstat -tlnp 2>/dev/null | grep :3000 || echo 'Port 3000 not in use or netstat unavailable'
          EOL
          
          # Make the script executable
          chmod +x diagnostics-temp.sh
          
          # Send the script to the server
          scp diagnostics-temp.sh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:/tmp/
          
          # Execute the script on the remote server
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} "
            export CONTAINER_NAME=${{ env.CONTAINER_NAME }}
            export DEPLOY_PATH=${{ env.DEPLOY_PATH }}
            export APP_DIR=nuxt-app
            
            bash /tmp/diagnostics-temp.sh
          "
          
          # Clean up
          rm diagnostics-temp.sh

      - name: 🎉 Patchy celebrates success
        if: success()
        run: |
          source .github/scripts/utils/slack-notify.sh
          send_deployment_success \
            "${{ github.event.inputs.environment || 'production' }}" \
            "${{ github.repository }}" \
            "${{ github.actor }}" \
            "${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 😱 Patchy reports failure
        if: failure()
        run: |
          source .github/scripts/utils/slack-notify.sh
          send_deployment_failure \
            "${{ github.event.inputs.environment || 'production' }}" \
            "${{ github.repository }}" \
            "${{ github.actor }}" \
            "${{ github.sha }}" \
            "${{ github.run_id }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}