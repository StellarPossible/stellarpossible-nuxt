# GitHub Actions workflow for deploying Stellar Possible Nuxt site to Hostinger
# Triggers on GitHub releases to build and deploy via SSH key authentication
name: Deploy to Hostinger

on:
  release:
    types:
      - released

jobs:
  deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code at the release tag
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js environment with caching for faster builds
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install all project dependencies
      - name: Install dependencies
        run: npm ci

      # Build and generate static site with WordPress content
      # Environment variables are injected during build time
      - name: Build and Generate Static Site
        run: npm run generate
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_GRAPHQL_ENDPOINT: ${{ secrets.WP_GRAPHQL_ENDPOINT }}
          WP_REST_ENDPOINT: ${{ secrets.WP_REST_ENDPOINT }}
          USE_JWT: ${{ secrets.USE_JWT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production

      # Create version tracking file for deployment verification
      - name: Create version file
        run: |
          echo "${{ github.event.release.tag_name }}" > .output/public/VERSION.txt
          echo "Build: ${{ github.sha }}" >> .output/public/VERSION.txt
          echo "Date: $(date -u)" >> .output/public/VERSION.txt

      # Setup SSH key for secure authentication
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 65002 -H ${{ secrets.HOSTINGER_FTP_SERVER }} >> ~/.ssh/known_hosts

      # Check available directories and permissions
      - name: Check remote directory structure
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.HOSTINGER_FTP_USERNAME }}@${{ secrets.HOSTINGER_FTP_SERVER }} \
            "pwd && ls -la"

      # Backup WordPress installation before deployment
      - name: Backup WordPress files
        run: |
          REMOTE_PATH="domains/stellarpossible.com/public_html/"
          echo "Creating backup of WordPress files..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.HOSTINGER_FTP_USERNAME }}@${{ secrets.HOSTINGER_FTP_SERVER }} \
            "cd $REMOTE_PATH && \
             mkdir -p ../backups && \
             if [ -f wp-config.php ]; then \
               echo 'Backing up WordPress installation...' && \
               tar -czf ../backups/wp-backup-$(date +%Y%m%d-%H%M%S).tar.gz \
                 wp-admin wp-includes wp-content wp-config.php *.php \
                 2>/dev/null || echo 'Some WordPress files may not exist yet'; \
             else \
               echo 'No WordPress installation found to backup'; \
             fi"

      # Deploy with WordPress preservation and proper routing
      - name: Deploy to Hostinger (preserving WordPress)
        run: |
          REMOTE_PATH="domains/stellarpossible.com/public_html/"
          echo "Deploying Nuxt frontend while preserving WordPress..."
          # Use rsync with excludes to preserve WordPress files
          rsync -avz \
            --exclude='wp-admin/' \
            --exclude='wp-includes/' \
            --exclude='wp-content/' \
            --exclude='wp-config.php' \
            --exclude='wp-*.php' \
            --exclude='xmlrpc.php' \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 65002" \
            .output/public/ \
            ${{ secrets.HOSTINGER_FTP_USERNAME }}@${{ secrets.HOSTINGER_FTP_SERVER }}:$REMOTE_PATH

      # Create proper .htaccess for headless WordPress + Nuxt frontend with JWT support
      - name: Configure server routing
        run: |
          REMOTE_PATH="domains/stellarpossible.com/public_html/"
          echo "Creating .htaccess for headless WordPress + Nuxt frontend with JWT support..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.HOSTINGER_FTP_USERNAME }}@${{ secrets.HOSTINGER_FTP_SERVER }} \
            "cd $REMOTE_PATH && cat > .htaccess << 'EOF'
          # Headless WordPress + Nuxt.js Frontend Configuration
          RewriteEngine On

          # WordPress Admin and Login Access
          RewriteRule ^wp-admin(.*)$ wp-admin$1 [L]
          RewriteRule ^wp-login\.php$ wp-login.php [L]
          RewriteRule ^wp-includes(.*)$ wp-includes$1 [L]

          # WordPress REST API, GraphQL, JWT Authentication, and AJAX
          RewriteRule ^wp-json(.*)$ index.php [L,QSA]
          RewriteRule ^jwt-auth(.*)$ index.php [L,QSA]
          RewriteRule ^graphql(.*)$ index.php [L,QSA]
          RewriteRule ^wp-admin/admin-ajax\.php$ wp-admin/admin-ajax.php [L]

          # WordPress Core Files (for API functionality)
          RewriteRule ^wp-(.*)\.php$ wp-$1.php [L]
          RewriteRule ^xmlrpc\.php$ xmlrpc.php [L]

          # WordPress uploads and content
          RewriteRule ^wp-content(.*)$ wp-content$1 [L]

          # Force homepage to Nuxt.js (override WordPress index.php)
          RewriteRule ^/?$ /index.html [L]

          # Nuxt.js Frontend - serve static files first
          RewriteCond %{REQUEST_FILENAME} -f
          RewriteCond %{REQUEST_URI} !^/wp-
          RewriteCond %{REQUEST_URI} !^/graphql
          RewriteCond %{REQUEST_URI} !^/jwt-auth
          RewriteRule ^(.*)$ $1 [L]

          # Nuxt.js Frontend - handle client-side routing
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_URI} !^/wp-
          RewriteCond %{REQUEST_URI} !^/graphql
          RewriteCond %{REQUEST_URI} !^/jwt-auth
          RewriteRule ^(.*)$ /index.html [L]

          # CORS headers for API requests
          <IfModule mod_headers.c>
              # Security headers
              Header always set X-Content-Type-Options nosniff
              Header always set X-Frame-Options DENY
              Header always set X-XSS-Protection "1; mode=block"
              
              # CORS headers for API endpoints
              SetEnvIf Origin "^https?://(localhost:3001|127\.0\.0\.1:3001|stellarpossible\.com)$" CORS_ORIGIN=$0
              Header always set Access-Control-Allow-Origin %{CORS_ORIGIN}e env=CORS_ORIGIN
              Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE, PATCH"
              Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin"
              Header always set Access-Control-Allow-Credentials "true"
              Header always set Access-Control-Max-Age "3600"
              
              # Handle preflight OPTIONS requests
              RewriteCond %{REQUEST_METHOD} OPTIONS
              RewriteRule ^(.*)$ $1 [R=200,L]
          </IfModule>

          # BEGIN WordPress
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          # END WordPress
          EOF"

      # Verify WordPress is still intact
      - name: Verify WordPress integrity
        run: |
          REMOTE_PATH="domains/stellarpossible.com/public_html/"
          echo "Checking WordPress installation integrity..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p 65002 \
            ${{ secrets.HOSTINGER_FTP_USERNAME }}@${{ secrets.HOSTINGER_FTP_SERVER }} \
            "cd $REMOTE_PATH && \
             if [ -f wp-config.php ]; then \
               echo '✅ WordPress configuration found'; \
               echo '✅ WordPress admin: $(ls -la wp-admin/ 2>/dev/null | wc -l) files'; \
               echo '✅ WordPress includes: $(ls -la wp-includes/ 2>/dev/null | wc -l) files'; \
               echo '✅ WordPress content: $(ls -la wp-content/ 2>/dev/null | wc -l) items'; \
             else \
               echo '❌ WordPress installation missing!'; \
               exit 1; \
             fi"

      # Test JWT endpoint after deployment
      - name: Test JWT endpoint
        run: |
          echo "Testing JWT authentication endpoint..."
          curl -X POST https://stellarpossible.com/wp-json/jwt-auth/v1/token \
            -H "Content-Type: application/json" \
            -d '{"username":"test","password":"test"}' \
            -w "HTTP Status: %{http_code}\n" || echo "JWT endpoint test completed"

      # Clean up SSH key for security
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      # Log deployment completion details
      - name: Verify deployment
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🚀 Site URL: https://stellarpossible.com"
          echo "📦 Version: ${{ github.event.release.tag_name }}"
          echo "🔨 Build SHA: ${{ github.sha }}"
          echo "📝 WordPress files preserved during deployment"
          echo "🔐 JWT authentication configured"